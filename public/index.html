<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="shortcut icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-thin-straight/css/uicons-thin-straight.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
  <link rel='stylesheet'
    href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-straight/css/uicons-regular-straight.css'>
  <link rel='stylesheet'
    href='https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-straight/css/uicons-solid-straight.css'>
  <link rel='stylesheet'
    href='https://cdn-uicons.flaticon.com/2.3.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

  <meta name="description" content="Web site created using create-react-app" />
  <title>Shipping & Transport app</title>
</head>

<body>
  <script
    src="https://cdn.jsdelivr.net/npm/ag-charts-community@9.0.1/dist/umd/ag-charts-community.js?t=1701859343933"></script>

  <!-- <script src="js/menu.js"> </script> -->
  <!-- <script src="js/main.js"> </script> -->
  <script src="https://apis.google.com/js/api.js"></script>
  <!-- <script src="js/dashboards-analytics.js"> </script> -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
    integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
    crossorigin="anonymous"></script>

  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #0d0f1a; position: fixed; top: 0; left: 0; z-index: 99999; font-family: sans-serif;">
      <div
        style="position: relative; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px;">
        <!-- Outer Ring -->
        <div
          style="width: 80px; height: 80px; border: 4px solid transparent; border-top-color: #00f2fe; border-bottom-color: #4facfe; border-radius: 50%; animation: html-spin 1.5s linear infinite; position: absolute;">
        </div>
        <!-- Inner Ring -->
        <div
          style="width: 55px; height: 55px; border: 4px solid transparent; border-left-color: #ff007f; border-right-color: #7f00ff; border-radius: 50%; animation: html-spin-reverse 1s linear infinite; position: absolute;">
        </div>
        <!-- Center Glow -->
        <div
          style="width: 20px; height: 20px; background-color: #00f2fe; border-radius: 50%; box-shadow: 0 0 25px #00f2fe, 0 0 50px #ff007f; position: absolute;">
        </div>
      </div>
      <p
        style="margin-top: 24px; font-size: 16px; font-weight: 600; color: #e2e8f0; letter-spacing: 2px; text-transform: uppercase; animation: html-pulse 2s ease-in-out infinite;">
        Loading...</p>
      <style>
        @keyframes html-spin {
          0% {
            transform: rotate(0deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }

        @keyframes html-spin-reverse {
          0% {
            transform: rotate(360deg);
          }

          100% {
            transform: rotate(0deg);
          }
        }

        @keyframes html-pulse {

          0%,
          100% {
            opacity: 0.6;
          }

          50% {
            opacity: 1;
          }
        }
      </style>
    </div>
  </div>
</body>

</html>
